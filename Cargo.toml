[package]
name    = "rs-cmish"
version = "0.1.0"
edition = "2024"

description = '''
Content Management Interactive Shell: a CLI for your CMIS archive.
'''

[profile.release]
codegen-units = 1
opt-level     = 3
lto           = "fat"
strip         = "symbols"
panic         = "abort"

[dependencies]
clap       = { version = " 4.5 ", features = ["cargo", "derive"] }
indicatif  = { version = " 0.18" }
serde      = { version = " 1.0 ", features = ["derive", "rc"] }
serde_json = { version = " 1.0 " }
shlex      = { version = " 1.3 " }
rustyline  = { version = "17.0 ", features = ["derive"]}
ureq       = { version = " 3.1 " }

[dev-dependencies]
